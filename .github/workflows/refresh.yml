name: Refresh market data
on:
  schedule:
    # Times are UTC. Jamaica is UTC-5; the JSE closes around 1:00 pm Jamaica time.
    - cron: '30 13 * * 1-5'   # 8:30 am Jamaica: BOJ rates and fund prices
    - cron: '45 18 * * 1-5'   # 1:45 pm Jamaica: JSE closing prices
    - cron: '30 22 * * 1-5'   # 5:30 pm Jamaica: late updates
    - cron: '0 15 * * 6'      # Saturday catch-up
  workflow_dispatch:
permissions: {contents: write}
concurrency: {group: refresh, cancel-in-progress: false}
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python scripts/fetch_data.py
      - run: |
          git config user.name "jamaica-money-bot"; git config user.email "actions@users.noreply.github.com"
          git add data/*.json
          git diff --cached --quiet || (git commit -m "Market data refresh" && git pull --rebase && git push)
